        function loadExample() {
            document.getElementById('dataInput').value = exampleData;
        }

        function clearData() {
            document.getElementById('dataInput').value = '';
            document.getElementById('resultsSection').classList.remove('show');
            hideMessages();
        }

        function hideMessages() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showError(msg) {
            document.getElementById('errorMsg').textContent = msg;
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            document.getElementById('successMsg').textContent = msg;
            document.getElementById('successMsg').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }

        function parseData(input) {
            const groups = [];
            
            // 清理输入：移除引号，然后按"#*# points ="分割
            const cleanInput = input.replace(/"/g, '').trim();
            console.log('清理后输入:', cleanInput);
            
            // 分割成独立的数据组
            const sections = cleanInput.split(/#\*#\s*points\s*=/).filter(s => s.trim().length > 0);
            console.log('分割的组数:', sections.length);
            
            for (let i = 0; i < sections.length; i++) {
                const section = sections[i].trim();
                console.log(`第${i+1}组数据:`, section.substring(0, 100) + '...');
                
                const lines = section.split('\n');
                const matrix = [];
                
                for (let line of lines) {
                    line = line.trim();
                    if (!line) continue;
                    
                    // 移除行首的#*#
                    if (line.startsWith('#*#')) {
                        line = line.substring(3).trim();
                    }
                    
                    // 移除可能的空格
                    line = line.replace(/\s+/g, ' ');
                    
                    // 分割数值
                    const values = [];
                    const parts = line.split(',');
                    
                    for (const part of parts) {
                        const num = parseFloat(part.trim());
                        if (!isNaN(num)) {
                            values.push(num);
                        }
                    }
                    
                    if (values.length > 0) {
                        matrix.push(values);
                        console.log(`  行 ${matrix.length}: ${values.length}个值, 示例: [${values.slice(0, 3).join(', ')}...]`);
                    }
                }
                
                if (matrix.length > 0) {
                    // 检查所有行是否有相同的列数
                    const firstCols = matrix[0].length;
                    let valid = true;
                    
                    for (let r = 1; r < matrix.length; r++) {
                        if (matrix[r].length !== firstCols) {
                            console.warn(`第${r+1}行列数不一致: ${matrix[r].length} vs ${firstCols}`);
                            valid = false;
                            break;
                        }
                    }
                    
                    if (valid) {
                        console.log(`  有效矩阵: ${matrix.length}×${firstCols}`);
                        groups.push(matrix);
                    }
                }
            }
            
            console.log('解析完成，总组数:', groups.length);
            return groups;
        }

        function calculateStd(values) {
            const method = document.getElementById('methodSelect').value;
            const n = values.length;
            
            if (n <= 1) return 0;
            
            if (method === 'range') {
                // 极差：最大值 - 最小值
                const max = Math.max(...values);
                const min = Math.min(...values);
                return max - min;
            }
            
            const mean = values.reduce((a, b) => a + b, 0) / n;
            
            if (method === 'population') {
                // 总体标准差 (除以n) - 你的公式图示
                const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / n;
                return Math.sqrt(variance);
            } else {
                // 样本标准差 (除以n-1) - 默认
                const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (n - 1);
                return Math.sqrt(variance);
            }
        }

        function getColorForValue(value, min, max) {
            const ratio = (value - min) / (max - min);
            // 绿色 -> 黄色 -> 红色
            if (ratio < 0.5) {
                const r = Math.round(46 + (243 - 46) * ratio * 2);
                const g = Math.round(204 + (156 - 204) * ratio * 2);
                const b = Math.round(113 + (18 - 113) * ratio * 2);
                return `rgba(${r}, ${g}, ${b}, 0.85)`;
            } else {
                const r = Math.round(243 + (231 - 243) * (ratio - 0.5) * 2);
                const g = Math.round(156 + (76 - 156) * (ratio - 0.5) * 2);
                const b = Math.round(18 + (60 - 18) * (ratio - 0.5) * 2);
                return `rgba(${r}, ${g}, ${b}, 0.85)`;
            }
        }

        function analyzeData() {
            hideMessages();
            const input = document.getElementById('dataInput').value;
            
            if (!input.trim()) {
                showError('请输入数据');
                return;
            }
            
            console.log('=== 开始分析 ===');
            console.log('原始输入:', input);
            
            const groups = parseData(input);
            
            console.log('解析结果:', groups);
            console.log('组数:', groups.length);
            
            if (groups.length === 0) {
                showError('无法解析数据，请检查格式是否正确。确保数据格式为：#*# points = 后接数据行');
                return;
            }
            
            if (groups.length < 2) {
                showError('至少需要2组数据才能计算标准差');
                return;
            }
            
            // 检查所有组的维度是否一致
            const rows = groups[0].length;
            const cols = groups[0][0].length;
            
            for (let i = 1; i < groups.length; i++) {
                if (groups[i].length !== rows || groups[i][0].length !== cols) {
                    showError(`第${i+1}组数据的维度与其他组不一致`);
                    return;
                }
            }
            
            // 计算每个位置的标准差
            const stdGrid = [];
            let minStd = Infinity;
            let maxStd = -Infinity;
            
            for (let r = 0; r < rows; r++) {
                const row = [];
                for (let c = 0; c < cols; c++) {
                    const values = groups.map(g => g[r][c]);
                    const std = calculateStd(values);
                    row.push(std);
                    minStd = Math.min(minStd, std);
                    maxStd = Math.max(maxStd, std);
                }
                stdGrid.push(row);
            }
            
            // 生成热力图数据
            const heatmapData = [];
            const labels = [];
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    heatmapData.push({
                        x: c,
                        y: r,
                        v: stdGrid[r][c]
                    });
                }
            }
            
            // 找到最稳定和最不稳定的位置
            let minPos = {r: 0, c: 0, v: Infinity};
            let maxPos = {r: 0, c: 0, v: -Infinity};
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (stdGrid[r][c] < minPos.v) {
                        minPos = {r, c, v: stdGrid[r][c]};
                    }
                    if (stdGrid[r][c] > maxPos.v) {
                        maxPos = {r, c, v: stdGrid[r][c]};
                    }
                }
            }
            
            // 显示结果
            document.getElementById('resultsSection').classList.add('show');
            
            // 渲染图表
            renderHeatmap(stdGrid, rows, cols, minStd, maxStd);
            
            // 显示统计信息
            const avgStd = stdGrid.flat().reduce((a, b) => a + b, 0) / (rows * cols);
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <h3>数据组数</h3>
                    <div class="value">${groups.length}</div>
                </div>
                <div class="stat-card">
                    <h3>网格尺寸</h3>
                    <div class="value">${rows} × ${cols}</div>
                </div>
                <div class="stat-card">
                    <h3>平均标准差</h3>
                    <div class="value">${avgStd.toFixed(6)}</div>
                </div>
                <div class="stat-card">
                    <h3>最稳定位置</h3>
                    <div class="value">(${minPos.r}, ${minPos.c})</div>
                    <small>σ = ${minPos.v.toFixed(6)}</small>
                </div>
                <div class="stat-card">
                    <h3>最不稳定位置</h3>
                    <div class="value">(${maxPos.r}, ${maxPos.c})</div>
                    <small>σ = ${maxPos.v.toFixed(6)}</small>
                </div>
            `;
            
            showSuccess(`成功解析 ${groups.length} 组数据，共 ${rows}×${cols} 个位置`);
            
            // 滚动到结果区域
            document.getElementById('resultsSection').scrollIntoView({behavior: 'smooth'});
        }

        function renderHeatmap(stdGrid, rows, cols, minStd, maxStd) {
            const ctx = document.getElementById('heatmapChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }
            
            // 准备数据集
            const datasets = [];
            
            for (let r = 0; r < rows; r++) {
                const data = [];
                for (let c = 0; c < cols; c++) {
                    data.push({
                        x: c,
                        y: r,
                        v: stdGrid[r][c]
                    });
                }
                datasets.push({
                    label: `Row ${r}`,
                    data: data,
                    backgroundColor: data.map(d => getColorForValue(d.v, minStd, maxStd)),
                    borderColor: 'rgba(255,255,255,0.5)',
                    borderWidth: 1,
                    pointRadius: 0,
                    pointHoverRadius: 0
                });
            }
            
            // 创建自定义插件来绘制热力图
            const heatmapPlugin = {
                id: 'heatmapPlugin',
                beforeDraw: (chart) => {
                    const ctx = chart.ctx;
                    const chartArea = chart.chartArea;
                    const xScale = chart.scales.x;
                    const yScale = chart.scales.y;
                    
                    const cellWidth = (chartArea.right - chartArea.left) / cols;
                    const cellHeight = (chartArea.bottom - chartArea.top) / rows;
                    
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const x = chartArea.left + c * cellWidth;
                            const y = chartArea.top + r * cellHeight;
                            const value = stdGrid[r][c];
                            
                            ctx.fillStyle = getColorForValue(value, minStd, maxStd);
                            ctx.fillRect(x, y, cellWidth, cellHeight);
                            
                            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(x, y, cellWidth, cellHeight);
                            
                            // 绘制数值
                            ctx.fillStyle = value > (minStd + maxStd) / 2 ? 'white' : 'black';
                            ctx.font = 'bold 11px Arial';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(value.toFixed(3), x + cellWidth/2, y + cellHeight/2);
                        }
                    }
                }
            };
            
            chart = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        data: []
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Position Variation Heatmap (Standard Deviation)',
                            font: { size: 18, weight: 'bold' },
                            padding: 20
                        },
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: () => '',
                                label: (context) => {
                                    const r = Math.floor(context.parsed.y);
                                    const c = Math.floor(context.parsed.x);
                                    if (r >= 0 && r < rows && c >= 0 && c < cols) {
                                        return `Position (${r}, ${c}): σ = ${stdGrid[r][c].toFixed(6)}`;
                                    }
                                    return '';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            min: -0.5,
                            max: cols - 0.5,
                            ticks: {
                                stepSize: 1,
                                callback: function(value) {
                                    return value >= 0 && value < cols ? value : '';
                                }
                            },
                            title: {
                                display: true,
                                text: 'Column Index',
                                font: { size: 14, weight: 'bold' }
                            },
                            grid: { display: false }
                        },
                        y: {
                            type: 'linear',
                            min: -0.5,
                            max: rows - 0.5,
                            ticks: {
                                stepSize: 1,
                                callback: function(value) {
                                    return value >= 0 && value < rows ? value : '';
                                }
                            },
                            title: {
                                display: true,
                                text: 'Row Index',
                                font: { size: 14, weight: 'bold' }
                            },
                            grid: { display: false }
                        }
                    }
                },
                plugins: [heatmapPlugin]
            });
        }
    </script>

</body></html>
