<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位置变化热力图分析器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select {
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            color: #333;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button.secondary {
            background: #6c757d;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }

        button.secondary:hover {
            background: #5a6268;
            box-shadow: 0 6px 20px rgba(108, 117, 125, 0.4);
        }

        .message {
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 10px;
            display: none;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .results-section {
            display: none;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 600px;
            margin: 20px 0;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 1.8rem;
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .chart-container {
                height: 400px;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>位置变化热力图分析器</h1>
            <p>多组位置数据离散程度分析与可视化</p>
        </div>

        <div class="card input-section">
            <div class="input-group">
                <label for="dataInput">输入位置数据（多组数据用 #*# points = 分隔）</label>
                <textarea id="dataInput" placeholder="请粘贴多组位置数据..."></textarea>
            </div>

            <div class="controls">
                <select id="calcMethod">
                    <option value="sample">样本标准差</option>
                    <option value="population">总体标准差</option>
                    <option value="range">极差</option>
                </select>
                <button onclick="analyzeData()">生成热力图</button>
                <button class="secondary" onclick="loadExample()">加载示例数据</button>
                <button class="secondary" onclick="clearData()">清空数据</button>
            </div>

            <div id="message" class="message"></div>
        </div>

        <div class="card results-section" id="resultsSection">
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #2ecc71;"></div>
                    <span>稳定（低离散度）</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #f39c12;"></div>
                    <span>中等（中离散度）</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #e74c3c;"></div>
                    <span>不稳定（高离散度）</span>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="heatmapChart"></canvas>
            </div>

            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </div>

    <!-- 修复：使用CDN加载依赖，GitHub Pages完美运行 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <script>
        // 全局变量
        let heatmapChart = null;

        // 显示消息
        function showMessage(text, isError = false) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = 'message ' + (isError ? 'error' : 'success');
            msgEl.style.display = 'block';
            
            setTimeout(() => {
                msgEl.style.display = 'none';
            }, 5000);
        }

        // 解析输入数据
        function parseData(input) {
            try {
                // 清理数据
                let cleaned = input.replace(/["'\s]/g, '');
                if (!cleaned) return [];

                // 分割多组数据
                const groups = cleaned.split('#*#points=').filter(g => g.trim());
                if (groups.length === 0) return [];

                // 解析每组数据
                return groups.map(group => {
                    const rows = group.split(';').filter(r => r.trim());
                    return rows.map(row => {
                        const cols = row.split(',').filter(c => c.trim());
                        return cols.map(Number);
                    });
                });
            } catch (e) {
                console.error('解析错误:', e);
                return [];
            }
        }

        // 计算标准差/极差
        function calculateValues(values, method) {
            if (values.length === 0) return 0;
            
            const mean = values.reduce((a, b) => a + b, 0) / values.length;
            
            if (method === 'sample') {
                // 样本标准差
                const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (values.length - 1 || 1);
                return Math.sqrt(variance);
            } else if (method === 'population') {
                // 总体标准差
                const variance = values.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / values.length;
                return Math.sqrt(variance);
            } else if (method === 'range') {
                // 极差
                return Math.max(...values) - Math.min(...values);
            }
            return 0;
        }

        // 渲染热力图
        function renderHeatmap(data, rows, cols, method) {
            const ctx = document.getElementById('heatmapChart').getContext('2d');
            
            // 销毁旧图表
            if (heatmapChart) {
                heatmapChart.destroy();
            }

            // 计算极值
            const flatData = data.flat();
            const minVal = Math.min(...flatData);
            const maxVal = Math.max(...flatData);

            // 创建新图表
            heatmapChart = new Chart(ctx, {
                type: 'matrix',
                data: {
                    datasets: [{
                        label: '离散度',
                        data: data.flatMap((row, i) => 
                            row.map((value, j) => ({ x: j, y: i, value }))
                        ),
                        backgroundColor: function(context) {
                            const value = context.dataset.data[context.dataIndex].value;
                            const alpha = (value - minVal) / (maxVal - minVal || 1);
                            if (alpha < 0.33) return `rgba(46, 204, 113, ${0.5 + alpha})`;
                            if (alpha < 0.66) return `rgba(243, 156, 18, ${0.5 + alpha})`;
                            return `rgba(231, 76, 60, ${0.5 + alpha})`;
                        },
                        borderColor: 'white',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return `位置 (${context[0].parsed.x + 1}, ${context[0].parsed.y + 1})`;
                                },
                                label: function(context) {
                                    return `${method === 'range' ? '极差' : '标准差'}: ${context.parsed.value.toFixed(4)}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'top',
                            ticks: {
                                stepSize: 1,
                                callback: function(value) { return value + 1; }
                            },
                            title: {
                                display: true,
                                text: '列'
                            }
                        },
                        y: {
                            type: 'linear',
                            ticks: {
                                stepSize: 1,
                                callback: function(value) { return value + 1; }
                            },
                            title: {
                                display: true,
                                text: '行'
                            }
                        }
                    }
                }
            });
        }

        // 主分析函数
        function analyzeData() {
            try {
                const input = document.getElementById('dataInput').value;
                const method = document.getElementById('calcMethod').value;

                // 数据校验
                if (!input.trim()) {
                    showMessage('请输入数据！', true);
                    return;
                }

                // 解析数据
                const groups = parseData(input);
                if (groups.length < 2) {
                    showMessage('至少需要2组数据进行对比！', true);
                    return;
                }

                // 校验维度一致
                const rows = groups[0].length;
                const cols = groups[0][0]?.length || 0;
                if (!rows || !cols) {
                    showMessage('数据格式错误！', true);
                    return;
                }

                for (let i = 1; i < groups.length; i++) {
                    if (groups[i].length !== rows || groups[i][0].length !== cols) {
                        showMessage(`第${i+1}组数据维度不匹配！`, true);
                        return;
                    }
                }

                // 计算每个位置的离散度
                const heatmapData = [];
                for (let i = 0; i < rows; i++) {
                    const row = [];
                    for (let j = 0; j < cols; j++) {
                        const values = groups.map(g => g[i][j]);
                        row.push(calculateValues(values, method));
                    }
                    heatmapData.push(row);
                }

                // 统计信息
                const allValues = heatmapData.flat();
                const avg = allValues.reduce((a,b)=>a+b,0)/allValues.length;
                const min = Math.min(...allValues);
                const max = Math.max(...allValues);
                
                // 找极值位置
                const minPos = allValues.indexOf(min);
                const maxPos = allValues.indexOf(max);
                const minCoord = `${Math.floor(minPos/cols)+1},${(minPos%cols)+1}`;
                const maxCoord = `${Math.floor(maxPos/cols)+1},${(maxPos%cols)+1}`;

                // 渲染
                renderHeatmap(heatmapData, rows, cols, method);
                renderStats({
                    groups: groups.length,
                    rows, cols, avg, min, max, minCoord, maxCoord, method
                });

                // 显示结果
                document.getElementById('resultsSection').style.display = 'block';
                showMessage('分析完成！');

            } catch (e) {
                console.error('分析错误:', e);
                showMessage('分析失败：' + e.message, true);
            }
        }

        // 渲染统计信息
        function renderStats(stats) {
            const grid = document.getElementById('statsGrid');
            const methodName = {
                sample: '样本标准差',
                population: '总体标准差',
                range: '极差'
            };

            grid.innerHTML = `
                <div class="stat-card">
                    <h3>数据组数</h3>
                    <p>${stats.groups}</p>
                </div>
                <div class="stat-card">
                    <h3>网格尺寸</h3>
                    <p>${stats.rows}×${stats.cols}</p>
                </div>
                <div class="stat-card">
                    <h3>平均${methodName[stats.method]}</h3>
                    <p>${stats.avg.toFixed(4)}</p>
                </div>
                <div class="stat-card">
                    <h3>最小${methodName[stats.method]}</h3>
                    <p>${stats.min.toFixed(4)}</p>
                </div>
                <div class="stat-card">
                    <h3>最大${methodName[stats.method]}</h3>
                    <p>${stats.max.toFixed(4)}</p>
                </div>
                <div class="stat-card">
                    <h3>最稳定位置</h3>
                    <p>${stats.minCoord}</p>
                </div>
                <div class="stat-card">
                    <h3>最不稳定位置</h3>
                    <p>${stats.maxCoord}</p>
                </div>
            `;
        }

        // 加载示例数据
        function loadExample() {
            const example = `1.2,1.5,1.3;1.4,1.6,1.2
#*# points =
1.3,1.4,1.5;1.2,1.5,1.4
#*# points =
1.1,1.6,1.2;1.5,1.3,1.5`;
            document.getElementById('dataInput').value = example;
            showMessage('示例数据已加载！');
        }

        // 清空数据
        function clearData() {
            document.getElementById('dataInput').value = '';
            document.getElementById('resultsSection').style.display = 'none';
            if (heatmapChart) {
                heatmapChart.destroy();
                heatmapChart = null;
            }
            showMessage('已清空！');
        }
    </script>
</body>
</html>
